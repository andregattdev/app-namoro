spring.application.name=api-encontros-casuais

spring.datasource.url=jdbc:postgresql://localhost:5432/api-projeto-encontros-casuais
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-value-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Preencha estas variáveis apenas para criar/promover o administrador inicial.
app.admin.email=${ADMIN_EMAIL:admin@email.com}
app.admin.password=${ADMIN_PASSWORD:A122584g@}
